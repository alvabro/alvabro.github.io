
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alvaro Ilizarbe</title>
<meta name="description" content="Alvaro Ilizarbe is a visual artist and curator based in Los Angeles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #ffffff;
    --ink: #1c1c1c;
    --quiet: #6b6b68;
    --ph: #e4e4e1;
    --ph-alt: #d3d3ce;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wall: #000000;
      --ink: #ecece9;
      --quiet: #9a9a95;
      --ph: #2d2d2b;
      --ph-alt: #363633;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 1.35vw, 1.5rem);
    font-weight: 500;
    letter-spacing: 0em;
    line-height: 1.2;
  }
  a { color: inherit; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  :root { --pad: clamp(1rem, 1.3vw, 1.25rem); }

  header {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: baseline;
    gap: 0.75rem 1.5rem;
    padding: 1.1rem var(--pad) 0;
    margin-bottom: clamp(3rem, 10vw, 9rem);
  }
  header a { text-decoration: none; }
  header a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .nav-end { display: flex; justify-content: space-between; }
  .contact { text-align: right; }
  @media (max-width: 40rem) {
    header { grid-template-columns: 1fr 1fr; }
    .nav-end { display: contents; }
    .contact { grid-column: 2; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: var(--pad);
    padding: 0 var(--pad) 5rem;
  }
  @media (max-width: 40rem) {
    .grid { grid-template-columns: 1fr; }
  }
  .work {
    position: relative;
    display: block;
    overflow: hidden;
    aspect-ratio: 3 / 2;
    text-decoration: none;
  }
  /* Placeholder frame. Replace each .ph div with:
     <img src="images/your-file.jpg" alt="Short description">
     Images are cropped to fill the frame, so any shape of photo works. */
  .ph, .work img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph { background: var(--ph); }
  .ph.alt { background: var(--ph-alt); }

  /* Title appears on hover or keyboard focus */
  .label {
    position: absolute;
    inset: auto 0 0 0;
    padding: 3rem var(--pad) var(--pad);
    color: #fff;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0));
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .work:hover .label, .work:focus-visible .label { opacity: 1; }
  .work:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .meta { display: block; opacity: 0.8; }
  @media (prefers-reduced-motion: reduce) { .label { transition: none; } }

  footer {
    padding: 0 var(--pad) 3rem;
    color: var(--quiet);
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <a href="index.html">ALVARO ILIZARBE</a>
  <a href="shop.html">Store</a>
  <div class="nav-end">
    <a href="about.html">Information</a>
    <span class="contact"><a href="mailto:alvaro.ilizarbe@gmail.com">Email</a>, <a href="https://www.instagram.com/alvaroilizarbe" target="_blank" rel="noopener">Instagram</a></span>
  </div>
</header>

<main>
  <div class="grid">
    <a class="work" href="burst.html">
      <img src="work/burst/burst-01.jpg" alt="Varnished Acrylic on routered mdf">
      <div class="label">Burst<span class="meta">2026</span></div>
    </a>
    <a class="work" href="thecomeup.html">
      <img src="work/thecomeup/thecomeup-01.JPG" alt="Acrylic on routered mdf">
      <div class="label">The Come Up / Group show / Book<span class="meta">2026</span></div>
    </a>
    <a class="work" href="thecomeup1.html">
      <img src="work/thecomeup/thecomeup.JPG" alt="Acrylic on routered mdf">
      <div class="label">The Come up / 2023<span class="meta"></span></div>
    </a>
    <a class="work" href="january.html">
      <img src="work/january/january-01.JPG" alt="Acrylic on routered mdf">
      <div class="label">January / 2025<span class="meta">Sculpture, 2025</span></div>
    </a>
    <a class="work" href="chessboard5.html">
      <img src="work/chessboard4/chessboard5-01.JPG" alt="Acrylic on routered mdf">
      <div class="label">Chessboard 5 / 2025<span class="meta"></span></div>
    </a>
    <a class="work" href="chessboard4.html">
      <img src="work/chessboard4/chessboard4-01.JPG" alt="Acrylic on routered mdf">
      <div class="label">Chessboard 4 / 2025<span class="meta"></span></div>
    </a>
    <a class="work" href="you.html">
      <img src="work/you/you-01.JPG" alt="Acrylic on routered mdf">
      <div class="label">Chessboard 4 / 2025<span class="meta"></span></div>
    </a>
  </div>
</main>

<footer>&copy; Alvaro Ilizarbe</footer>

</body>
</html>
