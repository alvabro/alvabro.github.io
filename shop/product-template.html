<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product name — Alvaro Ilizarbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

{% include header.html %}

<main>
  <article class="work">

    <div class="images">
      <!-- Replace the gray box with your photo(s), one <img> line per photo, in order:
           <img src="/work/product-name/product-name-01.jpg" alt="Describe what the photo shows">
           Delete the gray box line once you add a real image. -->
      <div class="ph"></div>
    </div>

    <div class="details">
      <h1>Product name</h1>
      <p class="quiet">Year, Medium, Size</p>
      <p>$000</p>

      <p class="desc">A short description of the work goes here. Delete this line if you don't want one.</p>
      <p class="desc quiet">Shipping is added at checkout.</p>

      <div class="buy">
        <a class="button" href="https://buy.stripe.com/your-link">Buy</a>
        <p class="quiet" style="margin-top: 1rem"><a class="inquire" href="#" data-subject="Product name">Inquire</a></p>
      </div>
    </div>

  </article>
</main>

<p class="back"><a href="/">&larr; Back to work</a></p>

<footer>&copy; Alvaro Ilizarbe</footer>

<script>
/* The email address is assembled only when Inquire is clicked, so it never sits in the page as plain text for spam bots to collect. */
document.querySelectorAll('.inquire').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    var address = ['alvaro.ilizarbe', 'gmail.com'].join('@');
    location.href = 'mailto:' + address + '?subject=' + encodeURIComponent('Inquiry: ' + a.dataset.subject);
  });
});
</script>

</body>
</html>
