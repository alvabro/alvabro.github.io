<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4th and Main — Alvaro Ilizarbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

{% include header.html %}

<main>
  <article class="work">

    <div class="images">
      <img src="/work/4thandmain/4thandmain-01.jpg" alt="4th and Main, image 1 of 4">
      <img src="/work/4thandmain/4thandmain-02.jpg" alt="4th and Main, image 2 of 4" loading="lazy">
      <img src="/work/4thandmain/4thandmain-03.jpg" alt="4th and Main, image 3 of 4" loading="lazy">
      <img src="/work/4thandmain/4thandmain-04.jpg" alt="4th and Main, image 4 of 4" loading="lazy">
    </div>

    <div class="details">
      <h1>4th and Main</h1>
      <p class="quiet">2016</p>

      <div class="buy">
        <p class="quiet"><a class="inquire" href="#" data-subject="4th and Main">Inquire</a></p>
      </div>
    </div>

  </article>
</main>

{% include header.html footer=true %}

<script>
/* The email address is assembled only when Inquire is clicked, so it never sits in the page as plain text for spam bots to collect. */
document.querySelectorAll('.inquire').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    var address = ['alvaro.ilizarbe', 'gmail.com'].join('@');
    location.href = 'mailto:' + address + '?subject=' + encodeURIComponent('Inquiry: ' + a.dataset.subject);
  });
});
</script>

</body>
</html>
