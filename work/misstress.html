<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misstress — Alvaro Ilizarbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

{% include header.html %}

<main>
  <article class="work">

    <div class="images">
      <img src="/work/misstress-agency/mistress-agency-01.jpg" alt="Misstress, image 1 of 5">
      <img src="/work/misstress-agency/mistress-agency-02.jpg" alt="Misstress, image 2 of 5" loading="lazy">
      <img src="/work/misstress-agency/mistress-agency-03.jpg" alt="Misstress, image 3 of 5" loading="lazy">
      <img src="/work/misstress-agency/mistress-agency-04.jpg" alt="Misstress, image 4 of 5" loading="lazy">
      <img src="/work/misstress-agency/mistress-agency-05.jpg" alt="Misstress, image 5 of 5" loading="lazy">
    </div>

    <div class="details">
      <h1>Misstress</h1>
      <p class="quiet">2017, Mural</p>
      <p class="desc">Brushstroke study mural for Misstress Agency in Santa Monica, CA. Approximately 200 ft.</p>

      <div class="buy">
        <p class="quiet"><a class="inquire" href="#" data-subject="Misstress">Inquire</a></p>
      </div>
    </div>

  </article>
</main>

{% include header.html footer=true %}

<script>
/* The email address is assembled only when Inquire is clicked, so it never sits in the page as plain text for spam bots to collect. */
document.querySelectorAll('.inquire').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    var address = ['alvaro.ilizarbe', 'gmail.com'].join('@');
    location.href = 'mailto:' + address + '?subject=' + encodeURIComponent('Inquiry: ' + a.dataset.subject);
  });
});
</script>

</body>
</html>
