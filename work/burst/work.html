<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alvaro Ilizarbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #ffffff;
    --ink: #1c1c1c;
    --quiet: #6b6b68;
    --ph: #e4e4e1;
    --pad: clamp(1rem, 1.3vw, 1.25rem);
  }
  @media (prefers-color-scheme: dark) {
    :root { --wall: #1d1d1c; --ink: #ecece9; --quiet: #9a9a95; --ph: #2d2d2b; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--wall);
    color: var(--ink);
    font-family: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: clamp(1rem, 1.35vw, 1.5rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    line-height: 1.2;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

  header {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    align-items: baseline;
    gap: 0.75rem 1.5rem;
    padding: 1.1rem var(--pad) 0;
    margin-bottom: clamp(3rem, 10vw, 9rem);
  }
  header a { text-decoration: none; }
  header a:hover { text-decoration: underline; text-underline-offset: 4px; }
  .nav-end { display: flex; justify-content: space-between; }
  .contact { text-align: right; }
  @media (max-width: 40rem) {
    header { grid-template-columns: 1fr 1fr; }
    .nav-end { display: contents; }
    .contact { grid-column: 2; }
  }

  /* Work layout: images take two thirds, details line up under the third nav column */
  .work {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--pad) 1.5rem;
    padding: 0 var(--pad) 3rem;
    align-items: start;
  }
  .images { grid-column: 1 / span 2; display: grid; gap: var(--pad); }
  .images img, .images .ph { width: 100%; height: auto; display: block; }
  .images .ph { aspect-ratio: 3 / 2; background: var(--ph); }
  .details { grid-column: 3; position: sticky; top: var(--pad); }
  @media (max-width: 50rem) {
    .work { grid-template-columns: 1fr; }
    .images, .details { grid-column: 1; }
    .details { position: static; }
  }
  .details h1 { font-size: inherit; font-weight: 500; margin: 0 0 0.25rem; }
  .details p { margin: 0; }
  .quiet { color: var(--quiet); }
  .desc { margin-top: 1.25rem !important; max-width: 32rem; }
  .buy { margin-top: 1.75rem; }
  .button {
    display: inline-block;
    background: var(--ink);
    color: var(--wall);
    padding: 0.7rem 1.25rem;
    text-decoration: none;
  }
  .button:hover { opacity: 0.85; }

  .pager {
    display: flex;
    justify-content: space-between;
    padding: 0 var(--pad) 4rem;
  }
  .pager a { text-decoration: none; }
  .pager a:hover { text-decoration: underline; text-underline-offset: 4px; }
  footer { padding: 0 var(--pad) 3rem; color: var(--quiet); font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <a href="index.html">Alvaro Ilizarbe</a>
  <a href="shop.html">Store</a>
  <div class="nav-end">
    <a href="about.html">Information</a>
    <span class="contact"><a href="mailto:you@example.com">Email</a>, <a href="https://www.instagram.com/yourhandle/" target="_blank" rel="noopener">Instagram &#8599;</a></span>
  </div>
</header>

<main>
  <article class="work" id="work"></article>
  <nav class="pager" id="pager" aria-label="More work"></nav>
  <noscript><p style="padding: 0 var(--pad)">Please turn on JavaScript to view this page.</p></noscript>
</main>

<footer>&copy; Alvaro Ilizarbe</footer>

<script>
/* ---------------------------------------------------------------
   YOUR WORKS. Add one block per work. The key (work-1, work-2...)
   is what the grid links use: work.html?w=work-1

   images: list of files you uploaded to the images folder.
           Leave the list empty [] to show a gray placeholder.
   buy:    paste your Stripe Payment Link between the quotes.
           Leave it empty "" to show "Not for sale" with an inquiry link.
   --------------------------------------------------------------- */
const works = {
  "work-1": {
    title: "Burst",
    year: "2026",
    medium: "Varnished Acrylic on Routered MDF",
    size: "18.5 x 18.5 x 1.5 in",
    description: "A short description of the work goes here.",
    images: ["burst-01.jpg"],
    buy: ""
  },
  "work-2": {
    title: "Title of work",
    year: "2025",
    medium: "Immersive installation",
    size: "Dimensions variable",
    description: "",
    images: ["burst-02.jpg"],
    buy: ""
  },
  "work-3": {
    title: "Title of work",
    year: "2025",
    medium: "Sculpture",
    size: "12 x 12 x 3 in",
    description: "",
    images: ["burst-03.jpg"],
    buy: ""
  },
  "work-4": {
    title: "Title of work",
    year: "2024",
    medium: "Acrylic on panel",
    size: "18 x 24 in",
    description: "",
    images: ["burst-04.jpg"],
    buy: ""
  },
  "work-5": {
    title: "Title of work",
    year: "2024",
    medium: "Mixed media",
    size: "20 x 20 in",
    description: "",
    images: [],
    buy: ""
  },
  "work-6": {
    title: "Title of work",
    year: "2023",
    medium: "Oil on canvas",
    size: "30 x 40 in",
    description: "",
    images: [],
    buy: ""
  }
};
const email = "you@example.com";

/* ---------------- Nothing below needs editing ---------------- */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text) node.textContent = text;
  return node;
}

const keys = Object.keys(works);
const id = new URLSearchParams(location.search).get("w");
const work = Object.prototype.hasOwnProperty.call(works, id) ? works[id] : null;
const root = document.getElementById("work");
const pager = document.getElementById("pager");

if (!work) {
  root.style.display = "block";
  const msg = el("p", "quiet", "That work was not found. ");
  const back = el("a", "", "Back to work");
  back.href = "index.html";
  msg.appendChild(back);
  root.appendChild(msg);
} else {
  document.title = work.title + " \u2014 Alvaro Ilizarbe";

  const images = el("div", "images");
  if (work.images.length === 0) {
    images.appendChild(el("div", "ph"));
  } else {
    work.images.forEach(function (src, i) {
      const img = document.createElement("img");
      img.src = src;
      img.alt = work.title + (work.images.length > 1 ? " (" + (i + 1) + " of " + work.images.length + ")" : "");
      images.appendChild(img);
    });
  }

  const details = el("div", "details");
  details.appendChild(el("h1", "", work.title));
  details.appendChild(el("p", "quiet", [work.year, work.medium, work.size].filter(Boolean).join(", ")));
  if (work.description) details.appendChild(el("p", "desc", work.description));

  const buy = el("div", "buy");
  if (work.buy && work.buy.indexOf("https://") === 0) {
    const a = el("a", "button", "Buy");
    a.href = work.buy;
    buy.appendChild(a);
  } else {
    const p = el("p", "quiet", "Not for sale. ");
    const a = el("a", "", "Inquire");
    a.href = "mailto:" + email + "?subject=" + encodeURIComponent("Inquiry: " + work.title);
    p.appendChild(a);
    buy.appendChild(p);
  }
  details.appendChild(buy);

  root.appendChild(images);
  root.appendChild(details);

  const i = keys.indexOf(id);
  const prev = el("a", "", i > 0 ? "\u2190 Previous" : "");
  const next = el("a", "", i < keys.length - 1 ? "Next \u2192" : "");
  if (i > 0) prev.href = "work.html?w=" + keys[i - 1];
  if (i < keys.length - 1) next.href = "work.html?w=" + keys[i + 1];
  pager.appendChild(prev);
  pager.appendChild(next);
}
</script>
</body>
</html>
