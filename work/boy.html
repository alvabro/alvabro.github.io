<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boy (self-portrait) — Alvaro Ilizarbe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

{% include header.html %}

<main>
  <article class="work">

    <div class="images">
      <img src="/work/boy/boy-01.jpg" alt="Boy (self-portrait), image 1 of 2">
      <img src="/work/boy/boy-02.jpg" alt="Boy (self-portrait), image 2 of 2" loading="lazy">
    </div>

    <div class="details">
      <h1>Boy (self-portrait)</h1>
      <p class="quiet">2016, Paint on MDF, 19.5 x 16 x 1.5 in</p>

      <div class="buy">
        <p class="quiet"><a class="inquire" href="#" data-subject="Boy (self-portrait)">Inquire</a></p>
      </div>
    </div>

  </article>
</main>

{% include header.html footer=true %}

<script>
/* The email address is assembled only when Inquire is clicked, so it never sits in the page as plain text for spam bots to collect. */
document.querySelectorAll('.inquire').forEach(function (a) {
  a.addEventListener('click', function (e) {
    e.preventDefault();
    var address = ['alvaro.ilizarbe', 'gmail.com'].join('@');
    location.href = 'mailto:' + address + '?subject=' + encodeURIComponent('Inquiry: ' + a.dataset.subject);
  });
});
</script>

</body>
</html>
